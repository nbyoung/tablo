  view_cause:
    type: object
    required: [kind, task, url, gate, status, pin, tip, resolver, mark, act, advance, holds]
    properties:
      kind: { $ref: "#/$defs/view_cause_kind" }
      task: { $ref: "#/$defs/view_task_ref" }
      url: { type: string }
      gate: { type: string }
      status: { $ref: "#/$defs/view_status" }
      pin: { type: string }
      tip: { type: string }
      resolver: { type: string }
      mark: { $ref: "#/$defs/view_cause_mark" }
      act: { $ref: "#/$defs/view_act" }
      advance: { $ref: "#/$defs/view_advance" }
      holds: { type: integer }
      held: { type: array, items: { $ref: "#/$defs/view_held" } }
      status_commit: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_commit" }] }
      junction: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_junction" }] }
      authorisation: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_authorisation" }] }
      linkage: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_linkage" }] }
      resolve: { type: array, items: { $ref: "#/$defs/view_command" } }
  view_cell:
    type: object
    required: [kind, historical, state, reason, marks, acts]
    properties:
      kind: { $ref: "#/$defs/view_cell_kind" }
      historical: { type: boolean }
      state: { type: string }
      reason: { type: string }
      marks: { type: array, items: { $ref: "#/$defs/view_mark_key" } }
      acts: { type: boolean }
  view_grid_row:
    type: object
    required: [id, title, under, depth, parent, hidden, label, status, leaf, cells]
    properties:
      id: { type: string }
      title: { type: string }
      under: { type: string }
      depth: { type: integer }
      parent: { type: boolean }
      hidden: { type: integer }
      label: { $ref: "#/$defs/view_label" }
      status: { $ref: "#/$defs/view_status" }
      leaf: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_leaf" }] }
      cells: { type: array, items: { $ref: "#/$defs/view_cell" } }
      status_commit: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_commit" }] }
      own_commit: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_commit" }] }
      chain: { type: array, items: { $ref: "#/$defs/view_step" } }
      junctions: { type: array, items: { $ref: "#/$defs/view_junction" } }
      sources: { type: array, items: { $ref: "#/$defs/view_supplier" } }
      linkages: { type: array, items: { $ref: "#/$defs/view_linkage" } }
  view_held:
    type: object
    required: [task, gate, parent, via, child, requires, contributor, also, held]
    properties:
      task: { $ref: "#/$defs/view_task_ref" }
      gate: { type: string }
      parent: { type: boolean }
      via: { $ref: "#/$defs/view_via" }
      child: { type: string }
      requires: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_requirement" }] }
      contributor: { type: string }
      also: { type: array, items: { type: integer } }
      held: { type: array, items: { $ref: "#/$defs/view_held" } }
  view_kind_count:
    type: object
    required: [kind, count]
    properties:
      kind: { $ref: "#/$defs/view_cause_kind" }
      count: { type: integer }
  view_leaf:
    type: object
    required: [task, url]
    properties:
      task: { $ref: "#/$defs/view_task_ref" }
      url: { type: string }
  view_parent_edge:
    type: object
    required: [parent, requires]
    properties:
      parent: { $ref: "#/$defs/view_task_ref" }
      requires: { $ref: "#/$defs/view_requirement" }
  view_queue:
    type: object
    required: [legend, items]
    properties:
      legend: { $ref: "#/$defs/view_legend" }
      items: { type: array, items: { $ref: "#/$defs/view_queue_item" } }
      brief: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_brief" }] }
  view_queue_item:
    type: object
    required: [kind, task, gate, model, since, age, causes, why]
    properties:
      kind: { $ref: "#/$defs/view_item_kind" }
      task: { $ref: "#/$defs/view_task_ref" }
      gate: { type: string }
      model: { type: string }
      since: { type: string }
      age: { type: integer }
      causes: { type: array, items: { $ref: "#/$defs/view_wait" } }
      why: { $ref: "#/$defs/view_why" }
      junction: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_junction" }] }
      sources: { type: array, items: { $ref: "#/$defs/view_supplier" } }
      task_references: { type: array, items: { $ref: "#/$defs/view_reference" } }
      requires: { type: array, items: { $ref: "#/$defs/view_requirement" } }
      unblocks: { type: array, items: { $ref: "#/$defs/view_requirement" } }
      also_required_by: { type: array, items: { $ref: "#/$defs/view_requirement" } }
      parent_unblocks: { type: array, items: { $ref: "#/$defs/view_parent_edge" } }
      status: { $ref: "#/$defs/view_status" }
      status_commit: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_commit" }] }
      authorisation: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_authorisation" }] }
  view_tableau:
    type: object
    required: [legend, subject, columns, rows]
    properties:
      legend: { $ref: "#/$defs/view_legend" }
      subject: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_task_ref" }] }
      columns: { type: array, items: { $ref: "#/$defs/view_column" } }
      rows: { type: array, items: { $ref: "#/$defs/view_grid_row" } }
      commands: { type: array, items: { $ref: "#/$defs/view_command" } }
  view_wait:
    type: object
    required: [kind, requires, reason, note, by]
    properties:
      kind: { $ref: "#/$defs/view_wait_kind" }
      requires: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_requirement" }] }
      reason: { type: string }
      note: { type: string }
      by: { type: string }
  view_waiting:
    type: object
    required: [task, status, next, requires]
    properties:
      task: { $ref: "#/$defs/view_task_ref" }
      status: { $ref: "#/$defs/view_status" }
      next: { type: string }
      requires: { type: array, items: { $ref: "#/$defs/view_requirement" } }

  # The data of the audit (design dada). The same conventions hold. A finding's
  # key is a rule id or one of the three kinds no rule states.
  view_severity:    { enum: [error, warning, information] }   # as the audit lists a finding
  view_finding_act: { enum: [authorise, review, reaffirm, record_handoff, clear_handoff, revise, move_pin, checkout, await, state_commit, raise_language, none] }   # the kind of action that resolves a finding
  view_finding_key: { oneOf: [{ type: string, pattern: "^[A-Z][0-9]+$" }, { enum: [proposed, stale, sole_review] }] }
  view_audit:
    type: object
    required: [legend, errors, warnings, information, most, findings]
    properties:
      legend: { $ref: "#/$defs/view_legend" }
      errors: { type: integer, minimum: 0 }
      warnings: { type: integer, minimum: 0 }
      information: { type: integer, minimum: 0 }
      most: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_resolving" }] }
      findings: { type: array, items: { $ref: "#/$defs/view_finding" } }
      silent: { type: array, items: { $ref: "#/$defs/view_silence" } }
  view_finding:
    type: object
    required: [key, rule, severity, demoted, kind, tasks, gate, act, resolver]
    properties:
      key: { $ref: "#/$defs/view_finding_key" }
      rule: { type: string }
      severity: { $ref: "#/$defs/view_severity" }
      demoted: { type: boolean }
      kind: { type: string }
      tasks: { type: array, items: { $ref: "#/$defs/view_task_ref" } }
      gate: { type: string }
      act: { $ref: "#/$defs/view_finding_act" }
      resolver: { type: string }
      files: { type: array, items: { type: string } }
      message: { type: string }
      sentence: { type: string }
      source: { $ref: "#/$defs/view_reference" }
      facts: { type: array, items: { $ref: "#/$defs/view_finding_facts" } }
      commits: { type: array, items: { $ref: "#/$defs/view_commit" } }
      commands: { type: array, items: { $ref: "#/$defs/view_command" } }
  view_finding_facts:
    type: object
    required: [task, junction, status, requirement, authorisation, linkage, model]
    properties:
      task: { type: string }
      junction: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_junction" }] }
      status: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_status" }] }
      requirement: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_requirement" }] }
      authorisation: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_authorisation" }] }
      linkage: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_linkage" }] }
      model: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_model_check" }] }
  view_resolving:
    type: object
    required: [email, count]
    properties:
      email: { type: string }
      count: { type: integer, minimum: 0 }
  view_silence:
    type: object
    required: [key, rule, kind]
    properties:
      key: { $ref: "#/$defs/view_finding_key" }
      rule: { type: string }
      kind: { type: string }

  # The data of the history (design 8ed1). A line's events are the task
  # definition's events, view_event, unchanged.
  view_line_effect: { enum: ["", authorised_commit, authorised_merge, authorised_trailer, proposed, handoff, accepts, stands, none] }   # what a line does to its task's acceptance or review; "" for nothing
  view_history:
    type: object
    required: [legend, subject, events, commits, kinds, days, lines]
    properties:
      legend: { $ref: "#/$defs/view_legend" }
      subject: { $ref: "#/$defs/view_task_ref" }
      events: { type: integer, minimum: 0 }
      commits: { type: integer, minimum: 0 }
      kinds: { type: array, minItems: 6, maxItems: 6, items: { $ref: "#/$defs/view_event_count" } }
      days: { type: array, items: { $ref: "#/$defs/view_day" } }
      lines: { type: array, items: { $ref: "#/$defs/view_line" } }
      commands: { type: array, items: { $ref: "#/$defs/view_command" } }
  view_event_count:
    type: object
    required: [kind, count]
    properties:
      kind: { $ref: "#/$defs/view_event_kind" }
      count: { type: integer, minimum: 0 }
  view_day:
    type: object
    required: [date, events, commits, kinds]
    properties:
      date: { $ref: "#/$defs/date" }
      events: { type: integer, minimum: 1 }
      commits: { type: integer, minimum: 1 }
      kinds: { type: array, items: { $ref: "#/$defs/view_event_count" } }
  view_line:
    type: object
    required: [task, proposal, events]
    properties:
      task: { $ref: "#/$defs/view_task_ref" }
      proposal: { type: boolean }
      events: { type: array, minItems: 1, items: { $ref: "#/$defs/view_event" } }
      after: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_status" }] }
      unchanged: { type: boolean }
      subject_after: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_status" }] }
      effect: { $ref: "#/$defs/view_line_effect" }
      model: { type: string }
      check: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_model_check" }] }
      committer: { type: string }
      co_author: { type: string }
      commit: { $ref: "#/$defs/view_commit" }
