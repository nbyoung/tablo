# Embedded as tablo.EnvelopeSchema.
#
# The envelope every tablo command writes with --json or --yaml. Every object
# here stays open: a consumer ignores a key it does not know, and a new key
# does not change the schema version. A key this file requires never goes
# away, changes type or changes meaning within tablo/1.
$schema: https://json-schema.org/draft/2020-12/schema
$id: tablo/envelope.schema.yaml
title: The tablo output envelope, schema tablo/1
type: object
required: [schema, command, source, project, viewer, params, data, diagnostics]
properties:
  schema:      { const: tablo/1 }
  command:     { enum: [gates, task, authority, assignment, queue, blockage, tableau, context, history, audit, validate, trailer, version] }
  source:      { oneOf: [{ type: "null" }, { $ref: "#/$defs/source" }] }
  project:     { oneOf: [{ type: "null" }, { $ref: "#/$defs/project" }] }
  viewer:      { oneOf: [{ type: "null" }, { $ref: "#/$defs/viewer" }] }
  params:      { $ref: "#/$defs/params" }
  data:        { type: [object, "null"] }
  diagnostics: { type: array, items: { $ref: "#/$defs/diagnostic" } }

allOf:
  # A view names its viewer and its level; the other commands name neither.
  - if:   { properties: { command: { enum: [gates, task, authority, assignment, queue, blockage, tableau, context, history, audit] } } }
    then:
      properties:
        source: { $ref: "#/$defs/source" }
        viewer: { $ref: "#/$defs/viewer" }
        params: { required: [role, level], properties: { level: { $ref: "#/$defs/level" } } }
    else:
      properties:
        viewer: { type: "null" }
        params: { maxProperties: 0 }
  # The parameters each view takes, every key present and null when unset.
  - if:   { properties: { command: { enum: [gates, task, authority, assignment, queue, blockage, context, history, audit] } } }
    then: { properties: { params: { required: [task] } } }
  - if:   { properties: { command: { enum: [task, authority, assignment, queue, blockage, tableau, context, history, audit] } } }
    then: { properties: { params: { required: [person] } } }
  - if:   { properties: { command: { enum: [tableau, context] } } }
    then: { properties: { params: { required: [window, columns, historical] } } }
  - if:   { properties: { command: { const: authority } } }
    then: { properties: { params: { required: [proposed] } } }
  - if:   { properties: { command: { const: queue } } }
    then: { properties: { params: { required: [brief] } } }
  - if:   { properties: { command: { const: audit } } }
    then: { properties: { params: { required: [stale, now, minimum] } } }
  - if:   { properties: { command: { const: validate } } }
    then:
      properties:
        source: { $ref: "#/$defs/source" }
        data:
          type: object
          required: [valid, errors, warnings, information]
          properties:
            valid:       { type: boolean }
            errors:      { type: integer, minimum: 0 }
            warnings:    { type: integer, minimum: 0 }
            information: { type: integer, minimum: 0 }
  - if:   { properties: { command: { const: trailer } } }
    then:
      properties:
        data:
          type: object
          required: [trailer, kind, task, gate, model]
          properties:
            trailer: { type: string, pattern: "^(Authorised|Reviewed|Reaffirmed|Model): \\S.*$" }
            kind:    { enum: [authorised, reviewed, reaffirmed, model] }
            task:    { oneOf: [{ type: "null" }, { $ref: "#/$defs/id" }] }
            gate:    { oneOf: [{ type: "null" }, { $ref: "#/$defs/key" }] }
            model:   { type: [string, "null"] }
  - if:   { properties: { command: { const: version } } }
    then:
      properties:
        source:  { type: "null" }
        project: { type: "null" }
        data:
          type: object
          required: [version, tableaux, schema]
          properties:
            version:  { type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" }
            tableaux: { type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$" }
            schema:   { const: tablo/1 }
  # The data of each structural view, and the keys of each level: a key that a
  # level adds is required from that level on and absent below it.
  - if:   { required: [command], properties: { command: { const: gates } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_gates" }] } } }
  - if:   { required: [command], properties: { command: { const: task } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_task" }] } } }
  - if:   { required: [command], properties: { command: { const: authority } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_delegation" }] } } }
  - if:   { required: [command], properties: { command: { const: assignment } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_assignment" }] } } }
  - if:   { required: [command, data, params], properties: { command: { const: gates }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { for_task: false, files: false, commands: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: gates }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { required: [for_task], properties: { files: false, commands: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: gates }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [for_task, files, commands] } } }
  - if:   { required: [command, data, params], properties: { command: { const: task }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { description: false, junctions: false, authorisation: false, events: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: task }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { required: [description, references, path, siblings, children, authorities, requires, dependents, junctions, snapshot], properties: { authorisation: false, events: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: task }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [description, references, path, siblings, children, authorities, requires, dependents, junctions, snapshot, status_commit, own_commit, authorisation, considered, chain, linkages, sources, reviews, models, events, event_count, commands] } } }
  - if:   { required: [command, data, params], properties: { command: { const: authority }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { authorities: false, parents: false, deciding: false, undecided: false, commands: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: authority }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { required: [authorities, parents], properties: { deciding: false, undecided: false, commands: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: authority }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [authorities, parents, deciding, undecided, commands] } } }
  - if:   { required: [command, data, params], properties: { command: { const: assignment }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { sections: false, commands: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: assignment }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { required: [sections], properties: { commands: false } } } }
  - if:   { required: [command, data, params], properties: { command: { const: assignment }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [sections, commands] } } }
  # The data of each status view, and the keys of each level, also inside a
  # row, a queue item and a cause, which nest a level as a view does. tableau
  # and context share one object, which holds the same keys at glance and at
  # detail.
  - if:   { required: [command], properties: { command: { const: tableau } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_tableau" }] } } }
  - if:   { required: [command], properties: { command: { const: context } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_tableau" }] } } }
  - if:   { required: [command], properties: { command: { const: queue } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_queue" }] } } }
  - if:   { required: [command], properties: { command: { const: blockage } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_blockage" }] } } }
  - if:   { required: [command, data, params], properties: { command: { enum: [tableau, context] }, data: { type: object }, params: { required: [level], properties: { level: { enum: [glance, detail] } } } } }
    then: { properties: { data: { properties: { commands: false, rows: { items: { properties: { status_commit: false, chain: false, junctions: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { enum: [tableau, context] }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [commands], properties: { rows: { items: { required: [status_commit, own_commit, chain, junctions, sources, linkages] } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: queue }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { brief: false, items: { items: { properties: { junction: false, requires: false, status: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: queue }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { properties: { brief: false, items: { items: { required: [junction, sources, task_references, requires, unblocks, also_required_by, parent_unblocks, status, status_commit, authorisation] } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: queue }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [brief], properties: { items: { items: { required: [junction, sources, task_references, requires, unblocks, also_required_by, parent_unblocks, status, status_commit, authorisation] } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: blockage }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { not_due: false, commands: false, causes: { items: { properties: { held: false, resolve: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: blockage }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { required: [not_due], properties: { commands: false, causes: { items: { required: [held], properties: { resolve: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: blockage }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [not_due, commands], properties: { causes: { items: { required: [held, status_commit, junction, authorisation, linkage, resolve] } } } } } }

  # The data of the two temporal views, and the keys of each level, also
  # inside a line and a finding, which nest a level as a view does.
  - if:   { required: [command], properties: { command: { const: history } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_history" }] } } }
  - if:   { required: [command, data, params], properties: { command: { const: history }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { commands: false, lines: { items: { properties: { after: false, effect: false, commit: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: history }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { properties: { commands: false, lines: { items: { required: [after, unchanged, subject_after, effect, model, check, committer, co_author], properties: { commit: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: history }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [commands], properties: { lines: { items: { required: [after, unchanged, subject_after, effect, model, check, committer, co_author, commit] } } } } } }
  - if:   { required: [command], properties: { command: { const: audit } } }
    then: { properties: { data: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_audit" }] } } }
  - if:   { required: [command, data, params], properties: { command: { const: audit }, data: { type: object }, params: { required: [level], properties: { level: { const: glance } } } } }
    then: { properties: { data: { properties: { silent: false, findings: { items: { properties: { files: false, message: false, sentence: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: audit }, data: { type: object }, params: { required: [level], properties: { level: { const: detail } } } } }
    then: { properties: { data: { required: [silent], properties: { findings: { items: { required: [files, message], properties: { sentence: false } } } } } } }
  - if:   { required: [command, data, params], properties: { command: { const: audit }, data: { type: object }, params: { required: [level], properties: { level: { const: provenance } } } } }
    then: { properties: { data: { required: [silent], properties: { findings: { items: { required: [files, message, sentence, source, facts, commits, commands] } } } } } }

$defs:
  id:     { type: string, pattern: "^[0-9a-f]{4}$" }
  key:    { type: string, pattern: "^[a-z][a-z0-9_-]*$" }
  email:  { type: string, pattern: "^[^@\\s]+@[^@\\s]+$" }
  commit: { type: string, pattern: "^[0-9a-f]{40}$" }
  date:   { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
  level:  { enum: [glance, detail, provenance] }
  role:   { enum: [owner, authority, assignee, contributor, agent, reviewer, observer] }

  # What the command reads.
  source:
    type: object
    required: [ref, dir, worktree, commit, date, from, trunk, on_trunk]
    properties:
      ref:      { type: string, minLength: 1 }       # the name given; for the working tree, the branch HEAD names, or HEAD
      dir:                                           # the project's directory, relative to the repository's root, with /; "." at the root
        type: string
        pattern: "^(\\.|[^/]+(/[^/]+)*)$"
        not: { pattern: "(^|/)\\.\\.(/|$)" }
      worktree: { type: boolean }                    # true when the files come from disk and the history from HEAD
      commit:   { oneOf: [{ type: "null" }, { $ref: "#/$defs/commit" }] }   # null for a bare tree, which validate alone reads
      date:     { oneOf: [{ type: "null" }, { $ref: "#/$defs/date" }] }     # the commit's author date
      from:                                          # the start of a range, for history alone
        oneOf:
          - { type: "null" }
          - type: object
            required: [ref, commit]
            properties:
              ref:    { type: string, minLength: 1 }
              commit: { $ref: "#/$defs/commit" }
      trunk:
        type: object
        required: [name, resolved]
        properties:
          name:     { type: [string, "null"] }
          resolved: { enum: [stated, inferred, caller, undetermined] }
      on_trunk: { type: boolean }

  # The project, null when the files give no root task.
  project:
    type: object
    required: [tableaux, root, title, owner]
    properties:
      tableaux: { type: string }                     # version.yaml's language version, as written
      root:     { $ref: "#/$defs/id" }
      title:    { type: string }                     # the root task's title
      owner:    { type: string }                     # the root task's assignee

  # Whoever runs the tool, and the roles that email holds anywhere in the project.
  viewer:
    type: object
    required: [email, roles]
    properties:
      email: { oneOf: [{ type: "null" }, { $ref: "#/$defs/email" }] }
      roles: { type: array, items: { $ref: "#/$defs/role" }, uniqueItems: true }

  # The parameters as resolved, defaults written in.
  params:
    type: object
    properties:
      task:       { oneOf: [{ type: "null" }, { $ref: "#/$defs/id" }] }
      person:     { oneOf: [{ type: "null" }, { $ref: "#/$defs/email" }] }
      role:       { oneOf: [{ type: "null" }, { $ref: "#/$defs/role" }] }
      level:      { oneOf: [{ type: "null" }, { $ref: "#/$defs/level" }] }
      window:     { type: [integer, "null"], minimum: 0 }
      columns:    { oneOf: [{ type: "null" }, { type: array, minItems: 1, items: { $ref: "#/$defs/key" }, uniqueItems: true }] }
      historical: { type: boolean }
      proposed:   { type: boolean }
      brief:
        oneOf:
          - { type: "null" }
          - type: object
            required: [task, gate]
            properties:
              task: { $ref: "#/$defs/id" }
              gate: { $ref: "#/$defs/key" }
      stale:      { type: integer, minimum: 1 }
      now:        { $ref: "#/$defs/date" }
      minimum:    { enum: [error, warning, information] }   # audit: the lowest severity listed

  # One finding of the loader or the validator.
  diagnostic:
    type: object
    required: [severity, code, message]
    properties:
      severity: { enum: [error, warning, information] }
      code:     { type: string, pattern: "^[A-Za-z][A-Za-z0-9.-]*$" }   # a rule id of corpus/RULES.md where one applies; the set grows
      path:     { type: string, pattern: "^\\.tableaux(/|$)" }   # relative to the directory -C names, with / on every host
      line:     { type: integer, minimum: 1 }
      col:      { type: integer, minimum: 1 }
      task:     { type: string }   # the name of the file the finding sits in, whatever it is: T1 reports leaf-two
      gate:     { type: string }   # the key as written: G5 reports Design
      commit:   { $ref: "#/$defs/commit" }
      trailer:  { type: string }
      message:  { type: string, minLength: 1 }
    dependentRequired: { line: [path], col: [line] }

  # The data of the four structural views (design 493e). Every object stays
  # open, as the envelope's do. A field is required unless its level leaves it
  # out; a pointer is null or its type; a list is an array; an embedded struct
  # joins the object that embeds it. Each name takes the prefix view_. The
  # closed sets of words are enums: a word added to a set widens tablo/1 and
  # changes no meaning.
  view_way:           { enum: [change, merge, trailer] }                    # how a deciding commit accepts
  view_way_or_none:   { enum: ["", change, merge, trailer] }                # "" with no deciding commit
  view_reading:       { enum: [agrees, differs, missing, exempt, unstated] }   # how a Model: trailer reads against its junction
  view_junction_kind: { enum: [plain, recursive, not_applicable] }
  view_status_kind:   { enum: [recorded, absent, rollup, snapshot] }
  view_origin_kind:   { enum: [rollup, snapshot] }
  view_why:           { enum: ["", no_history, no_trunk, off_trunk, no_commit, no_link, no_task, no_gate, no_state, no_children, cycle] }   # why a fact is undetermined; "" when it is not
  view_hand:          { enum: ["", author, committer, both] }               # which identity of a deciding commit is an authority; "" for a proposed task
  view_known:         { enum: [unknown, "no", "yes"] }                      # a fact of a pin or of a trunk that may be undetermined
  view_effect:        { enum: [accepts, authorisation, none] }              # what accepts a reviewed junction
  view_event_kind:    { enum: [task, authorised, status, reaffirmed, reviewed, pin] }
  view_mark_key:      { enum: [person, agent, reviewer, subproject, exempt] }
  view_change:        { enum: [added, changed, removed, pin] }              # what a commit does to a path
  view_stands:        { enum: ["", passed, here, next, later, exempt] }     # where a junction stands against its task's status; "" on a parent
  view_form:          { enum: [submodule, directory, url, none] }           # the form of a link; none where the path leads nowhere
  view_field:         { enum: [contributor, model, reviewer, references, subproject, applies] }   # the field of a junction a supplier states
  view_condition:     { enum: ["", met, unmet, pending] }                   # a requirement's condition; "" when undetermined
  view_position_kind: { enum: [assignee, authority, contributes, reviews, recursive] }
  view_assigned_row:
    type: object
    required: [id, title, under, status, next, next_gate]
    properties:
      id: { type: string }
      title: { type: string }
      under: { type: string }
      status: { $ref: "#/$defs/view_status" }
      next: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_junction" }] }
      next_gate: { type: string }
  view_assignment:
    type: object
    required: [legend, people, recursive]
    properties:
      legend: { $ref: "#/$defs/view_legend" }
      people: { type: array, items: { $ref: "#/$defs/view_person_row" } }
      recursive: { type: array, items: { type: string } }
      sections: { type: array, items: { $ref: "#/$defs/view_person_section" } }
      commands: { type: array, items: { $ref: "#/$defs/view_command" } }
  view_authorisation:
    type: object
    required: [commit, way, by, email, judges, why, differs_from_trunk, uncommitted]
    properties:
      commit: { oneOf: [{ type: "null" }, { $ref: "#/$defs/view_commit" }] }
      way: { $ref: "#/$defs/view_way_or_none" }
      by: { $ref: "#/$defs/view_hand" }
      email: { type: string }
      judges: { type: array, items: { type: string } }
      why: { $ref: "#/$defs/view_why" }
      differs_from_trunk: { type: boolean }
      uncommitted: { type: boolean }
  view_authority:
    type: object
    required: [email, by]
    properties:
      email: { type: string }
      by: { type: string }
  view_chain:
    type: object
    required: [id, title, assignee, authorities, children, defaults, sources]
    properties:
      id: { type: string }
      title: { type: string }
      assignee: { type: string }
      authorities: { type: array, items: { $ref: "#/$defs/view_authority" } }
      children: { type: array, items: { type: string } }
      defaults: { type: array, items: { $ref: "#/$defs/view_junction" } }
      sources: { type: array, items: { $ref: "#/$defs/view_supplier" } }
  view_child:
    type: object
    required: [id, title, order, status]
    properties:
      id: { type: string }
      title: { type: string }
      order: { oneOf: [{ type: "null" }, { type: integer }] }
      status: { $ref: "#/$defs/view_status" }
  view_column:
    type: object
    required: [gates, folded, count, by_gate]
    properties:
      gates: { type: array, items: { type: string } }
      folded: { type: boolean }
      count: { type: integer }
      by_gate: { type: array, items: { type: integer } }
  view_command:
    type: object
    required: [text, comment]
    properties:
      text: { type: string }
      comment: { type: string }
  view_commit:
    type: object
    required: [hash, subject, date, author_time, author, committer, parents, trailers, files]
    properties:
      hash: { type: string }
      subject: { type: string }
      date: { type: string }
      author_time: { type: string }
      author: { $ref: "#/$defs/view_person" }
      committer: { $ref: "#/$defs/view_person" }
