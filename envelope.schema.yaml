  # The data of the four status views (design 886d). The closed sets of words
  # are enums, as those of the structural views are.
  view_cell_kind:  { enum: [empty, status, marks, exempt] }                             # what a cell of a tableau shows
  view_label:      { enum: ["", spine, sibling] }                                       # a row of the contextual tableau; "" in the focus
  view_item_kind:  { enum: [review, authorisation, ready, reaffirmation, waiting] }     # a queue item, in the queue's order
  view_cause_kind: { enum: [requirement, status, review, authorisation, snapshot] }     # a cause of the blockage tree
  view_act:        { enum: [contributes, records, reviews, authorises, advances] }      # the act that resolves a cause
  view_via:        { enum: [self, parent, requirement] }                                # how a cause holds a task
  view_advance:    { enum: ["", pin, gate] }                                            # what a snapshot cause advances; "" for another cause
  view_cause_mark: { enum: ["", person, agent, reviewer, subproject] }                  # the mark of a cause's resolver; "" for none
  view_wait_kind:  { enum: [requirement, reason, authorisation, review] }               # why a work item waits, in the order of its causes
  view_source_kind: { enum: [task, assignee, nearest, default] }                        # where a field of a brief resolves from
  view_follows:    { enum: ["", plain, recursive] }                                     # the kind of the junction after a brief's gate; "" at the last
