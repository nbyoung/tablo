  - { url: https://github.com/nbyoung/tableaux/blob/main/corpus/README.md#how-a-tool-consumes-the-corpus, text: "How a tool consumes the corpus" }
  - { url: https://github.com/nbyoung/tableaux/blob/main/.tableaux/tasks/e9c6.yaml, text: "The abstract views and their focusing parameters" }
  - { url: README.md#what-it-does, text: "The command and its subcommands" }
requires:
  - { id: "4091", from: implementation, to: implementation, text: The views it emits }
  - { id: "dada", from: implementation, to: implementation, text: The audit it emits }
