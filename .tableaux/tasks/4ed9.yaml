title: Plumbing command
description: >
  The tablo command: validate, audit, view, status, history and trailer
  subcommands that read a repository at a ref and emit JSON or YAML, and a
  trailer subcommand that composes the Authorised, Reviewed and Reaffirmed lines
  a porcelain puts into a commit. Scripts and every front end call it or embed
  the library behind it.
