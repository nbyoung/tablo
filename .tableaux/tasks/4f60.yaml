title: Loader
description: >
  Reads a project's .tableaux directory from a worktree or from any Git ref
  through git ls-tree and git cat-file, parses each YAML file into a typed model
  that keeps file and line positions for diagnostics, and checks version.yaml
  against the versions the module accepts.
