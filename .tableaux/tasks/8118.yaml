title: Validator
description: >
  Validates a loaded project: each file against its schema, then the rules
  README.md states, among them one root, parent chains that end at the root,
  requirements without cycles and never to an ancestor or descendant, junction
  keys that name gates, gates that apply to the tasks whose requirements name
  them, no recursive junction on a parent, and status files that keep the
  undefined rule. Emits diagnostics with positions and severities.
assignee: noreply@anthropic.com
references:
  - { url: https://github.com/nbyoung/tableaux/blob/main/corpus/RULES.md#tasksidyaml, text: "The rules for task files" }
  - { url: https://github.com/nbyoung/tableaux/blob/main/corpus/RULES.md#requires-in-a-task-file, text: "The rules for requirements" }
  - { url: https://github.com/nbyoung/tableaux/blob/main/corpus/RULES.md#junctions-in-a-task-file, text: "The rules for junctions" }
  - { url: https://github.com/nbyoung/tableaux/blob/main/corpus/RULES.md#statusidyaml, text: "The rules for status files" }
  - { url: https://github.com/nbyoung/tablo/blob/main/design/4f60.md, text: "The model the Loader hands the Validator, and the L rules it raises itself" }
  - { url: https://github.com/nbyoung/tablo/blob/main/design/4b4f.md, text: "The conformance run that compares the validator's findings with the corpus" }
requires:
  - { id: "4f60", from: implementation, to: design, text: The model it validates }
junctions:
  mockup:         { applies: false }
parent: { id: "b2c1", order: 3 }
