# tasks/b2c1.yaml — the root task
title: tablo
description: >
  The Tableaux backend: a Go library and a plumbing command that load, validate, audit and derive a Tableaux project from a Git repository and serve every abstract view as data.
  This project is one subproject of the Tableaux tooling plan in the tableaux
  repository, whose task for it delegates every gate after defined here. It
  inherits that plan's review policy: agents contribute at every gate, each on
  the model family the junction names, and the owner reviews mockups, designs,
  validation and releases.
assignee: nbyoung@nbyoung.com
references:
  - { url: README.md, text: The charter }
  - { url: https://github.com/nbyoung/tableaux/blob/main/PLAN.md, text: The Tableaux tooling plan }
junctions:
  defined:        { contributor: noreply@anthropic.com, model: claude-haiku }
  mockup:         { contributor: noreply@anthropic.com, model: claude-opus, reviewer: nbyoung@nbyoung.com }
  function:       { contributor: noreply@anthropic.com, model: claude-sonnet, reviewer: false }
  design:         { contributor: noreply@anthropic.com, model: claude-opus, reviewer: nbyoung@nbyoung.com, references: [ { url: docs/gates/design.md, text: What the design gate asks for } ] }
  implementation: { contributor: noreply@anthropic.com, model: claude-opus, reviewer: false, references: [ { url: docs/gates/implementation.md, text: What the implementation gate asks for } ] }
  unit:           { contributor: noreply@anthropic.com, model: claude-sonnet, reviewer: false, references: [ { url: docs/gates/unit.md, text: What the unit gate asks for } ] }
  integrate:      { contributor: noreply@anthropic.com, model: claude-sonnet, reviewer: false }
  validate:       { contributor: noreply@anthropic.com, model: claude-sonnet, reviewer: nbyoung@nbyoung.com }
  release:        { contributor: nbyoung@nbyoung.com }
