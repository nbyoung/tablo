title: Language 0.4
description: >
  Raises the language tablo reads from 0.3 to 0.4.0, which the method designs
  7166, 9f3f and ac33 compose: the Loader accepts 0.4.0 and the agents file;
  the Validator and the Audit raise H7, H8, J18, J19, R14, A1 and A2; and the
  Derivation reads a task's subproject field, an unpinned requirement, an
  agent identity, the nearest person as an agent's reviewer, the waiver and
  the merge that authorises a task, each by the version at the commit, until
  the conformance test passes the corpus at 0.4.0.
