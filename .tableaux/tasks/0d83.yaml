title: Bootstrap
description: >
  The Go module github.com/nbyoung/tablo with its licence, README, continuous
  integration that formats, vets, lints and tests, and a copy of the tableaux
  schema files pinned to a language version. The module states the tableaux
  versions it accepts.
  A release workflow cross-compiles one static binary for Linux, macOS and
  Windows on amd64 and arm64 and publishes them, so no user installs Go.
assignee: noreply@anthropic.com
